name: Build Hawza Knowledge Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "knowledge/build/**"
      - "knowledge/sources/**"
      - "knowledge/metadata/**"
      - "knowledge/manifest.json"
      - "book/**"
      - "*.pdf"
      - ".github/workflows/build-hawza-knowledge.yml"

concurrency:
  group: hawza-knowledge-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knowledge/build/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r knowledge/build/requirements.txt

      - name: Build production knowledge database
        run: |
          python knowledge/build/build_knowledge.py \
            --manifest knowledge/manifest.json

      - name: Validate database
        run: |
          python knowledge/build/validate_knowledge.py --query "التوحيد"

      - name: Generate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          DB="knowledge/output/hawza_knowledge.sqlite"
          SHA256="$(sha256sum "$DB" | awk '{print $1}')"
          SIZE="$(stat -c%s "$DB")"
          VERSION="$(date -u +'%Y.%m.%d.%H%M%S')-${GITHUB_SHA::7}"
          TAG="knowledge-${VERSION}"
          UPDATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          printf '%s  %s\n' "$SHA256" "hawza_knowledge.sqlite" \
            > knowledge/output/hawza_knowledge.sqlite.sha256

          python - <<PY
          import json
          from pathlib import Path

          payload = {
              "schema": 1,
              "version": "${VERSION}",
              "database": "hawza_knowledge.sqlite",
              "sha256": "${SHA256}",
              "size": ${SIZE},
              "updated_at": "${UPDATED_AT}",
              "git_commit": "${GITHUB_SHA}",
              "download_url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hawza_knowledge.sqlite",
          }

          Path("knowledge/output/version.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawza-knowledge-${{ steps.metadata.outputs.version }}
          path: |
            knowledge/output/hawza_knowledge.sqlite
            knowledge/output/hawza_knowledge.sqlite.sha256
            knowledge/output/version.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            knowledge/output/hawza_knowledge.sqlite \
            knowledge/output/hawza_knowledge.sqlite.sha256 \
            knowledge/output/version.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hawza Knowledge $VERSION" \
            --notes "Automated validated Hawza knowledge database build from commit $GITHUB_SHA." \
            --latest

      - name: Print stable update URLs
        run: |
          echo "Manifest: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/version.json"
          echo "Database: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hawza_knowledge.sqlite"
          echo "Checksum: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/hawza_knowledge.sqlite.sha256"
