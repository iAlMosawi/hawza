name: Build Hawza Knowledge Database

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "knowledge/**"
      - "book/**"
      - "*.pdf"
      - ".github/workflows/build-hawza-knowledge.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: knowledge/build/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r knowledge/build/requirements.txt

      - name: Build production knowledge database
        run: |
          python knowledge/build/build_knowledge.py \
            --manifest knowledge/manifest.json

      - name: Validate knowledge database
        run: |
          python knowledge/build/validate_knowledge.py

      - name: SQLite integrity check
        run: |
          RESULT=$(sqlite3 knowledge/output/hawza_knowledge.sqlite \
            "PRAGMA integrity_check;")

          echo "$RESULT"

          test "$RESULT" = "ok"

      - name: Generate SHA256
        run: |
          cd knowledge/output
          sha256sum hawza_knowledge.sqlite \
            > hawza_knowledge.sqlite.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hawza-knowledge
          path: |
            knowledge/output/hawza_knowledge.sqlite
            knowledge/output/hawza_knowledge.sqlite.sha256
          if-no-files-found: error
